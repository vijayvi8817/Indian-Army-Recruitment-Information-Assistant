services:
  - type: web
    name: indian-army-faq-assistant
    env: python
    region: singapore
    plan: free
    buildCommand: "cd frontend && npm install && npm run build && cd .. && pip install -r requirements.txt"
    startCommand: "python -m uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: ADMIN_KEY
        value: admin123
      - key: PYTHON_VERSION
        value: 3.11.0
